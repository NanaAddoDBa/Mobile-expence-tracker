name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_tracker_test
          POSTGRES_USER: expense_tracker
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_tracker -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://expense_tracker:test-password@localhost:5432/expense_tracker_test?schema=public
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-characters
      COOKIE_SECURE: "false"
      BANK_CONNECTIONS_ENABLED: "false"
      BANK_SYNC_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Validate and generate Prisma client
        run: |
          npm run db:validate
          npm run db:generate

      - name: Apply committed migrations
        run: npm run db:migrate:deploy

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          npm --prefix server audit --omit=dev

      - name: Test API
        run: |
          npm run build:api
          npm --prefix server run test -- --runInBand
          npm --prefix server run test:e2e -- --runInBand

      - name: Validate frontend
        run: |
          npm run lint
          npm run lint:styles
          npm run typecheck
          npm run test
          npm run build
