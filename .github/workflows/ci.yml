name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev

      - name: Lint source and styles
        run: |
          npm run lint
          npm run lint:styles

      - name: Check frontend types
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_tracker_test
          POSTGRES_USER: expense_tracker
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_tracker -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://expense_tracker:test-password@localhost:5432/expense_tracker_test?schema=public
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-characters
      COOKIE_SECURE: "false"
      BANK_CONNECTIONS_ENABLED: "false"
      BANK_SYNC_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install API dependencies
        run: npm --prefix server ci --no-audit --no-fund

      - name: Validate and generate Prisma client
        run: |
          npm run db:validate
          npm run db:generate

      - name: Apply committed migrations
        run: npm run db:migrate:deploy

      - name: Audit API production dependencies
        run: npm --prefix server audit --omit=dev

      - name: Build API
        run: npm run build:api

      - name: Test API
        run: |
          npm --prefix server run test -- --runInBand
          npm --prefix server run test:e2e -- --runInBand

  validate:
    if: ${{ always() }}
    needs: [frontend, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require frontend and API checks
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$API_RESULT" = success
